name: bcc323-test
services:
  backend-test:
    build:
      context: ./backend
      target: test

  backend:
    environment:
      FIREBASE_PROJECT_ID: demo-bcc323
      FIREBASE_AUTH_EMULATOR_HOST: firebase:9099
      FIRESTORE_EMULATOR_HOST: firebase:8080
    build:
      context: ./backend
      target: runtime
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8081/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  firebase:
    build:
      context: .
      dockerfile: docker/firebase/Dockerfile
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "Promise.all([fetch('http://127.0.0.1:8080'),fetch('http://127.0.0.1:9099')]).then(()=>process.exit(0)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 4s
      retries: 30
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.test
    depends_on:
      firebase:
        condition: service_healthy
    environment:
      CI: "true"
      FIRESTORE_EMULATOR_HOST: firebase:8080
      FIRESTORE_RULES_PATH: /firebase/firestore.rules
      FIREBASE_PROJECT_ID: demo-bcc323
    volumes:
      - ./firebase/firestore.rules:/firebase/firestore.rules:ro
    command: ["bun", "run", "test:integration"]

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.test
    depends_on:
      backend:
        condition: service_healthy
      firebase:
        condition: service_healthy
    environment:
      API_PROXY_TARGET: http://backend:8081
      CI: "true"
      VITE_USE_EMULATORS: "true"
      VITE_FIREBASE_EMULATOR_HOST: firebase
      VITE_FIREBASE_PROJECT_ID: demo-bcc323
      VITE_FIREBASE_API_KEY: demo-key
      VITE_FIREBASE_AUTH_DOMAIN: demo-bcc323.firebaseapp.com
      VITE_FIREBASE_APP_ID: "1:123456789:web:demo"
    command: ["sh", "-c", "bun run build && bun run preview --host 0.0.0.0 --port 4173"]
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:4173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 30
      start_period: 10s

  playwright:
    build:
      context: ./frontend
      dockerfile: Dockerfile.e2e
    depends_on:
      web:
        condition: service_healthy
    environment:
      CI: "true"
      E2E_BASE_URL: http://web:4173
      E2E_AUTH_EMULATOR_URL: http://firebase:9099
      FIRESTORE_EMULATOR_HOST: firebase:8080
      SEED_SCRIPT_PATH: /seed/seed-demo.mjs
      COURSE_FIXTURE_PATH: /seed/curriculum.json
    volumes:
      - ./frontend/playwright-report:/app/playwright-report
      - ./frontend/test-results:/app/test-results
      - ./scripts/seed-demo.mjs:/seed/seed-demo.mjs:ro
      - ./backend/test/fixtures/curriculum.json:/seed/curriculum.json:ro
    command: ["bun", "run", "test:e2e"]
