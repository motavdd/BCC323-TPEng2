name: CI / Docker

on:
  pull_request:
    branches: [Develop, Staging, Master]
  push:
    branches: [Develop]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-native:
    name: linux-native
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: '.bun-version'
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++
      - name: Validate shell syntax
        run: for script in scripts/*.sh; do bash -n "$script"; done
      - name: Setup native Linux environment
        run: bash scripts/setup-local.sh
      - name: Native Linux quality checks
        run: bash scripts/check-local.sh
      - name: Native backend HTTP tests
        run: python3 backend/test/smoke.py backend/build/linux/bin/bcc323-api

  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Build C++ test image
        run: docker compose -f compose.test.yml build backend-test
      - name: C++ HTTP smoke tests
        run: docker compose -f compose.test.yml run --rm --no-deps backend-test
      - name: Cleanup
        if: always()
        run: docker compose -f compose.test.yml down -v --remove-orphans

  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Build Docker test image
        run: docker compose -f compose.test.yml build frontend
      - name: Lint
        run: docker compose -f compose.test.yml run --rm --no-deps frontend bun run lint
      - name: Typecheck
        run: docker compose -f compose.test.yml run --rm --no-deps frontend bun run typecheck
      - name: Unit tests
        run: docker compose -f compose.test.yml run --rm --no-deps frontend bun run test:unit
      - name: Build frontend
        run: docker compose -f compose.test.yml run --rm --no-deps frontend bun run build
      - name: Cleanup
        if: always()
        run: docker compose -f compose.test.yml down -v --remove-orphans

  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Build Firebase and frontend images
        run: docker compose -f compose.test.yml build firebase frontend
      - name: Firestore security rules tests
        run: docker compose -f compose.test.yml run --rm frontend bun run test:integration
      - name: Firebase logs on failure
        if: failure()
        run: docker compose -f compose.test.yml logs firebase
      - name: Cleanup
        if: always()
        run: docker compose -f compose.test.yml down -v --remove-orphans

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Build backend, Firebase, web and Playwright images
        run: docker compose -f compose.test.yml build backend firebase web playwright
      - name: Browser E2E against Firebase emulators
        run: docker compose -f compose.test.yml run --rm playwright
      - name: Upload Playwright reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
          if-no-files-found: warn
      - name: Container logs on failure
        if: failure()
        run: docker compose -f compose.test.yml logs firebase web
      - name: Cleanup
        if: always()
        run: docker compose -f compose.test.yml down -v --remove-orphans
