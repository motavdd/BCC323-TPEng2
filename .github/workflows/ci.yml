name: CI / Docker

on:
  pull_request:
    branches: [Develop, Staging, Master]
  push:
    branches: [Develop]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Build C++ test image
        run: docker compose -f compose.test.yml build backend-test
      - name: C++ HTTP smoke tests
        run: docker compose -f compose.test.yml run --rm --no-deps backend-test
      - name: Cleanup
        if: always()
        run: docker compose -f compose.test.yml down -v --remove-orphans

  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Build Docker test image
        run: docker compose -f compose.test.yml build frontend
      - name: Lint
        run: docker compose -f compose.test.yml run --rm --no-deps frontend bun run lint
      - name: Typecheck
        run: docker compose -f compose.test.yml run --rm --no-deps frontend bun run typecheck
      - name: Unit tests
        run: docker compose -f compose.test.yml run --rm --no-deps frontend bun run test:unit
      - name: Build frontend
        run: docker compose -f compose.test.yml run --rm --no-deps frontend bun run build
      - name: Cleanup
        if: always()
        run: docker compose -f compose.test.yml down -v --remove-orphans

  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Build Firebase and frontend images
        run: docker compose -f compose.test.yml build firebase frontend
      - name: Firestore security rules tests
        run: docker compose -f compose.test.yml run --rm frontend bun run test:integration
      - name: Firebase logs on failure
        if: failure()
        run: docker compose -f compose.test.yml logs firebase
      - name: Cleanup
        if: always()
        run: docker compose -f compose.test.yml down -v --remove-orphans

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Build backend, Firebase, web and Playwright images
        run: docker compose -f compose.test.yml build backend firebase web playwright
      - name: Browser E2E against Firebase emulators
        run: docker compose -f compose.test.yml run --rm playwright
      - name: Upload Playwright reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
          if-no-files-found: warn
      - name: Container logs on failure
        if: failure()
        run: docker compose -f compose.test.yml logs firebase web
      - name: Cleanup
        if: always()
        run: docker compose -f compose.test.yml down -v --remove-orphans
