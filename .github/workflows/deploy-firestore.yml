name: Manual / Firestore Rules

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Ambiente alvo (executa regras da branch correspondente)'
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

jobs:
  validate:
    name: validate-target-branch
    runs-on: ubuntu-latest
    steps:
      - name: Reject mismatched branch and environment
        env:
          TARGET: ${{ inputs.target }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [[ "$TARGET" == 'staging' && "$BRANCH" == 'Staging' ]]; then exit 0; fi
          if [[ "$TARGET" == 'production' && "$BRANCH" == 'Master' ]]; then exit 0; fi
          echo 'Erro: selecione a branch Staging/staging ou Master/production.' >&2
          exit 1

  rules:
    needs: validate
    name: firestore-rules
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    permissions:
      contents: read
      id-token: write
    env:
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
    steps:
      - name: Checkout trusted branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target == 'production' && 'Master' || 'Staging' }}
      - name: Authenticate using Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          project_id: ${{ vars.FIREBASE_PROJECT_ID }}
          create_credentials_file: true
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: '.bun-version'
      - name: Install Firebase CLI
        run: bun install --global firebase-tools@15.0.0
      - name: Publish reviewed Firestore rules only
        run: firebase deploy --only firestore:rules --project "$FIREBASE_PROJECT_ID" --non-interactive
